# =============================================================================
# TICKET-ADV049 — prod profile: PostgreSQL, secrets only from env
#
# Nothing here may be a literal credential. Every secret comes from env vars
# resolved at container start (see docker-compose.yml + GitHub Actions secrets).
# =============================================================================
spring:
  datasource:
    url: ${RECONX_DB_URL}
    username: ${RECONX_DB_USER}
    password: ${RECONX_DB_PASSWORD}
    hikari:
      maximum-pool-size: 30
      connection-timeout: 3000
      leak-detection-threshold: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

reconx:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXP_MIN:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    com.dbtraining.reconx: INFO
    root: WARN
