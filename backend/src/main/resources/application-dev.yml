# =============================================================================
# TICKET-ADV049 — dev profile: H2 in-memory + Kafka can be disabled if not running
# =============================================================================
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/reconx}
    username: ${SPRING_DATASOURCE_USERNAME:reconx_user}
    password: ${SPRING_DATASOURCE_PASSWORD:reconx_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

  # H2 doesn't ship a JSONB type — Liquibase preconditions in the changelog skip
  # the JSONB GIN-index step on H2 (see 003-jsonb.xml).

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    listener:
      missing-topics-fatal: false   # don't blow up if Kafka isn't running locally



logging:
  level:
    com.dbtraining.reconx: DEBUG
    org.hibernate.SQL: DEBUG
